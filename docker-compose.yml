services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./db:/app/db
      - ./private:/app/private
      - ./content:/app/content
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
